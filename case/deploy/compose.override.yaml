# Дополнение к compose.yaml арены для кейса AR-04а. Подключается вторым -f:
#   docker compose -f compose.yaml -f <repo>/case/deploy/compose.override.yaml --env-file ... --profile train run --rm researcher
services:
  researcher:
    image: ar04a-researcher:local
    environment:
      # постоянный HOME исследователя: логин Claude Code и транскрипты сессий (для экспорта трейсов агентов)
      HOME: /home/researcher
      ARENA_PUBLIC_URL: ${ARENA_PUBLIC_URL:-http://host.docker.internal:8090}
      ARENA_TRAIN_URL: ${ARENA_TRAIN_URL:-http://host.docker.internal:8070}
      ARENA_PRIVATE_URL: ${ARENA_PRIVATE_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${ARENA_RESEARCHER_HOME:-/srv/arena/researcher-home}
        target: /home/researcher
        bind:
          create_host_path: false
      # только submit-токены исследователя; операторский env и секреты сюда не попадают
      - type: bind
        source: ${ARENA_RESEARCHER_TOKENS:-/srv/arena/researcher-tokens}
        target: /run/secrets/arena
        read_only: true
        bind:
          create_host_path: false
