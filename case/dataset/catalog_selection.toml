# Отбор фиксированного каталога навыков из официального реестра MCP
# (https://registry.modelcontextprotocol.io, снимок 2026-11-02).
#
# Кластер — группа навыков, близких по смыслу (источник hard negatives).
# keywords — регулярные выражения для подбора кандидатов (шаг `candidates`),
# servers — отобранные вручную серверы с закреплёнными версиями (шаг `build`).
# id навыка по умолчанию — последний сегмент имени; общий или конфликтующий задаётся явно.
#
# Критерии отбора: одна понятная основная функция; английское описание без обрезки;
# внутри кластера навыки похожи, но различимы; несколько лексических ловушек
# (cron-translator, mindmeister, words), где совпадение слов не означает совпадения смысла.
# Кластер misc — одиночные навыки без близких соседей.

[[cluster]]
id = "web-search"
keywords = ['web search', 'search the web', 'search engine', 'serp']
servers = [
  { name = "io.github.serpapi/serpapi-mcp", version = "2.0.0" },
  { name = "io.github.A1-x-Tech/mcp-google-custom-search", version = "1.1.1" },
  { name = "io.github.johnisanerd/yandex-search", version = "1.0.0" },
  { name = "uk.miapi/miapi", version = "1.1.1" },
  { name = "io.github.reinartz/gannet-mcp", version = "0.1.0" },
  { name = "io.github.DataLeadsPRO/google-serp", version = "1.0.1" },
  { name = "app.seolytics/seolytics", version = "1.0.0" },
]

