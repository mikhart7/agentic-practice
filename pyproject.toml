[project]
name = "ar04a-skill-select"
version = "0.1.0"
description = "AR-04а: подбор навыка по запросу — ранжировщик, выращенный на арене"
requires-python = ">=3.11,<3.14"
dependencies = [
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

# Машина без GPU: берём CPU-сборку torch, CUDA-колёса не нужны.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["case/metric/tests", "skill/tests"]
